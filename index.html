    <script>
      // Immediate polyfill execution to catch any storage access issues early
      (function() {
        function createMemoryStorage() {
          var _data = {};
          return {
            getItem: function(key) { return _data[key] || null; },
            setItem: function(key, value) { _data[key] = String(value); },
            removeItem: function(key) { delete _data[key]; },
            clear: function() { _data = {}; },
            key: function(index) { return Object.keys(_data)[index] || null; },
            get length() { return Object.keys(_data).length; }
          };
        }

        function shimStorage(type) {
          try {
            var test = '__storage_test__';
            window[type].setItem(test, test);
            window[type].removeItem(test);
          } catch (e) {
            console.warn('Polyfilling ' + type + ' due to restriction: ' + e.message);
            try {
              var mock = createMemoryStorage();
              Object.defineProperty(window, type, {
                value: mock,
                configurable: true,
                writable: true
              });
            } catch (err) {
              console.error('Failed to polyfill ' + type + ': ' + err.message);
            }
          }
        }

        shimStorage('localStorage');
        shimStorage('sessionStorage');
      })();
    </script>
